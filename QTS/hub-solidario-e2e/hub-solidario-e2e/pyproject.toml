[project]
name = "hub-solidario-e2e"
version = "0.1.0"
description = "Projeto de testes E2E com Playwright, Page Object Model e FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: Testes de ponta a ponta (End-to-End) com Playwright",
    "unit: Testes unitarios isolados",
    "integration: Testes de integracao entre componentes",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
